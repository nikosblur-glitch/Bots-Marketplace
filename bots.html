.container {

}

.category-title {

    margin-bottom: 20px;
}

.categories {
    display: flex;

.category-btn:hover,

    transform: translateY(-2px);
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap: 20px;
    padding-bottom: 80px;
}

.product {
    padding: 25px;
    border-radius: 22px;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.10);

    backdrop-filter: blur(20px);

    transition: .35s;
}

.product:hover {
    transform: translateY(-7px);
    border-color: rgba(114,128,255,.5);
}

.product-icon {
    font-size: 45px;
    margin-bottom: 15px;
}

.product h3 {
    font-size: 22px;
    margin-bottom: 10px;
}

.product-category {

    padding: 5px 10px;

    background: rgba(88,101,242,.20);

}

.product p {

}

.price {
    font-size: 24px;

    margin-bottom: 15px;
}

.product-buttons {
    display: flex;
    gap: 8px;
}

.btn {

    padding: 12px;

    border-radius: 10px;

    border: none;

    color: white;

    cursor: pointer;

    text-decoration: none;

    text-align: center;

    font-weight: bold;
}

.btn-primary {
    background: linear-gradient(135deg,#5865f2,#8b5cf6);
}

.btn-secondary {
    background: rgba(255,255,255,.08);
}

/* EMPTY */

.empty {
    text-align: center;
    grid-column: 1/-1;

    padding: 60px 20px;

    color: rgba(255,255,255,.45);
}

/* MOBILE */

@media(max-width:700px) {

    .navbar {
        flex-direction: column;
        gap: 12px;
    }

    .hero {
        padding-top: 60px;
    }

    .product-buttons {
        flex-direction: column;
    }
}
</style>
</head>

<script>

/*

Οι τιμές είναι ενδεικτικές.
Μπορείς να τις αλλάξεις αργότερα.

====================================================
*/

const defaultBots = [

    },

    {

    },

    {

    },

    {

    },

    {

        icon: "🛠️",
        price: 4.99,
        description: "Useful commands and server utilities."
    },

    {
        id: "ai-bot",
        name: "AI Assistant",
        category: "ai",
        icon: "🧠",
        price: 14.99,
        description: "AI-powered assistant for your Discord server."
    },

    {
        id: "anime-bot",
        name: "Anime Bot",
        category: "anime",
        icon: "🌸",
        price: 5.99,
        description: "Anime commands, profiles and entertainment."
    },

    {
        id: "social-bot",
        name: "Social Bot",
        category: "social",
        icon: "💬",
        price: 5.99,
        description: "Social profiles and community interaction."
    },

    {
        id: "ticket-bot",
        name: "Ticket Bot",
        category: "tickets",
        icon: "🎫",
        price: 7.99,
        description: "Professional ticket support system."
    },

    {
        id: "verification-bot",
        name: "Verification Bot",
        category: "verification",
        icon: "✅",
        price: 5.99,
        description: "Verification and captcha systems."
    },

    {
        id: "logging-bot",
        name: "Logging Bot",
        category: "logging",
        icon: "📋",
        price: 5.99,
        description: "Track server events and moderation logs."
    },

    {
        id: "roles-bot",
        name: "Role Manager",
        category: "roles",
        icon: "🎭",
        price: 4.99,
        description: "Automatic and interactive role management."
    },

    {
        id: "giveaway-bot",
        name: "Giveaway Bot",
        category: "giveaways",
        icon: "🎁",
        price: 3.99,
        description: "Create and manage Discord giveaways."
    },

    {
        id: "notifications-bot",
        name: "Notification Bot",
        category: "notifications",
        icon: "🔔",
        price: 6.99,
        description: "Notifications for YouTube, Twitch and social platforms."
    },

    {
        id: "multipurpose-bot",
        name: "Multipurpose Bot",
        category: "multipurpose",
        icon: "⭐",
        price: 19.99,
        description: "A complete multi-feature Discord bot."
    }

];


/*
====================================================
LOAD OWNER BOTS
====================================================
*/

let ownerBots =
    JSON.parse(
        localStorage.getItem("DBM_BOTS")
    ) || [];


/*
====================================================
COMBINE PRODUCTS
====================================================
*/

let allBots = [
    ...defaultBots,
    ...ownerBots
];


/*
====================================================
RENDER BOTS
====================================================
*/

function renderBots(category = "all") {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    let filteredBots = allBots;

    if (category !== "all") {

        filteredBots =
            allBots.filter(
                bot =>
                bot.category === category
            );

    }

    if (filteredBots.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>No bots found</h2>
                <p>There are no products in this category yet.</p>
            </div>
        `;

        return;
    }


    filteredBots.forEach(bot => {

        const card =
            document.createElement("div");

        card.className = "product";


        card.innerHTML = `

            <div class="product-icon">
                ${bot.icon || "🤖"}
            </div>

            <span class="product-category">
                ${bot.category}
            </span>

            <h3>
                ${escapeHTML(bot.name)}
            </h3>

            <p>
                ${escapeHTML(
                    bot.description ||
                    "Premium Discord bot."
                )}
            </p>

            <div class="price">
                €${Number(bot.price).toFixed(2)}
            </div>

            <div class="product-buttons">

                <button
                    class="btn btn-primary"
                    onclick="addToCart('${bot.id}')"
                >
                    🛒 Add to Cart
                </button>

            </div>

        `;

        container.appendChild(card);

    });

}


/*
====================================================
FILTER
====================================================
*/

function filterBots(category, button) {

    document
        .querySelectorAll(".category-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    renderBots(category);

}


/*
====================================================
ADD TO CART
====================================================
*/

function addToCart(botId) {

    const bot =
        allBots.find(
            item =>
            String(item.id) ===
            String(botId)
        );


    if (!bot) {

        alert("Bot not found.");

        return;

    }


    let cart =
        JSON.parse(
            localStorage.getItem("DBM_CART")
        ) || [];


    const existing =
        cart.find(
            item =>
            String(item.id) ===
            String(bot.id)
        );


    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            id: bot.id,

            name: bot.name,

            price: Number(bot.price),

            quantity: 1,

            type: "bot"

        });

    }


    localStorage.setItem(
        "DBM_CART",
        JSON.stringify(cart)
    );


    alert(
        bot.name +
        " added to cart!"
    );

}


/*
====================================================
ESCAPE HTML
====================================================
*/

function escapeHTML(text) {

    return String(text)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


/*
====================================================
START
====================================================
*/

renderBots();

</script>
