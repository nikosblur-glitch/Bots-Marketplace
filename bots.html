```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discord Bots | Discord Board Marketplace</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: #05060b;
    overflow-x: hidden;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(circle at 15% 20%, rgba(88,101,242,.22), transparent 30%),
        radial-gradient(circle at 85% 70%, rgba(139,92,246,.18), transparent 30%),
        #05060b;
}

.orb {
    position: absolute;
    width: 550px;
    height: 550px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .25;
    animation: move 15s infinite alternate ease-in-out;
}

.orb.one {
    background: #5865f2;
    top: -250px;
    left: -200px;
}

.orb.two {
    background: #8b5cf6;
    right: -250px;
    bottom: -200px;
}

@keyframes move {
    from {
        transform: translate(0,0) scale(1);
    }

    to {
        transform: translate(100px,80px) scale(1.2);
    }
}

/* NAVBAR */

.navbar {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);

    width: 94%;
    max-width: 1250px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 20px;

    border-radius: 20px;

    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12);

    backdrop-filter: blur(25px);

    z-index: 1000;
}

.logo {
    font-weight: 900;
}

.logo span {
    color: #7280ff;
}

.nav-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.nav-links a {
    color: rgba(255,255,255,.65);
    text-decoration: none;

    padding: 9px 13px;
    border-radius: 10px;

    transition: .3s;
}

.nav-links a:hover {
    color: white;
    background: rgba(255,255,255,.1);
}

.cart {
    background: linear-gradient(135deg,#5865f2,#8b5cf6);
    color: white !important;
}

/* PAGE */

.page {
    width: 92%;
    max-width: 1200px;

    margin: auto;

    padding:
        170px 0
        100px;
}

.header {
    text-align: center;
    margin-bottom: 60px;
}

.header h1 {
    font-size: clamp(45px,7vw,80px);
    margin-bottom: 20px;
}

.header h1 span {
    color: #7280ff;
}

.header p {
    color: rgba(255,255,255,.55);
    font-size: 18px;
}

/* BOT GRID */

.bot-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px,1fr)
        );

    gap: 22px;
}

/* BOT CARD */

.bot-card {
    overflow: hidden;

    border-radius: 24px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter: blur(25px);

    transition: .4s;
}

.bot-card:hover {
    transform: translateY(-10px);

    border-color:
        rgba(114,128,255,.5);

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.4);
}

.bot-image {
    height: 180px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            rgba(88,101,242,.3),
            rgba(139,92,246,.2)
        );

    font-size: 65px;
}

.bot-content {
    padding: 25px;
}

.bot-content h3 {
    font-size: 23px;
    margin-bottom: 10px;
}

.bot-description {
    color: rgba(255,255,255,.55);
    line-height: 1.6;
    min-height: 50px;
}

.bot-info {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-top: 22px;
}

.price {
    font-size: 22px;
    font-weight: 900;
    color: #8d96ff;
}

.stock {
    color: rgba(255,255,255,.5);
    font-size: 14px;
}

.buy-button {
    display: block;

    width: 100%;

    margin-top: 18px;

    padding: 13px;

    border: none;
    border-radius: 12px;

    color: white;

    cursor: pointer;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #8b5cf6
        );

    transition: .3s;
}

.buy-button:hover {
    transform: translateY(-3px);
}

.buy-button:disabled {
    background: #333642;
    cursor: not-allowed;
}

/* EMPTY */

.empty {
    grid-column: 1 / -1;

    padding: 60px;

    text-align: center;

    border-radius: 25px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.1);

    color:
        rgba(255,255,255,.5);
}

/* MOBILE */

@media(max-width:700px) {

    .navbar {
        flex-direction: column;
        gap: 10px;
    }

    .page {
        padding-top: 210px;
    }

}
</style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
</div>

<nav class="navbar">

    <div class="logo">
        Discord
        <span>Board</span>
        Marketplace
    </div>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="bots.html">
            🤖 Bots
        </a>

        <a href="hosting.html">
            ☁️ Hosting
        </a>

        <a href="support.html">
            🎧 Support
        </a>

        <a href="cart.html" class="cart">
            🛒 Cart
        </a>

    </div>

</nav>

<main class="page">

    <div class="header">

        <h1>
            Discord <span>Bots</span>
        </h1>

        <p>
            Discover premium Discord bots
            for your community.
        </p>

    </div>

    <div
        class="bot-grid"
        id="botGrid"
    >

    </div>

</main>

<script>

const bots =
    JSON.parse(
        localStorage.getItem("DBM_BOTS")
    ) || [];

const botGrid =
    document.getElementById("botGrid");


function escapeHTML(text) {

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function renderBots() {

    botGrid.innerHTML = "";

    if (bots.length === 0) {

        botGrid.innerHTML = `
            <div class="empty">

                <h2>
                    🤖 No Bots Available
                </h2>

                <p style="margin-top:10px;">
                    New bots will appear here soon.
                </p>

            </div>
        `;

        return;
    }


    bots.forEach(bot => {

        const card =
            document.createElement("div");

        card.className =
            "bot-card";


        const image =
            bot.image
            ? `<img
                src="${escapeHTML(bot.image)}"
                style="width:100%;height:100%;object-fit:cover;"
              >`
            : "🤖";


        card.innerHTML = `

            <div class="bot-image">
                ${image}
            </div>

            <div class="bot-content">

                <h3>
                    ${escapeHTML(bot.name)}
                </h3>

                <p class="bot-description">
                    ${escapeHTML(
                        bot.description ||
                        "Premium Discord Bot."
                    )}
                </p>

                <div class="bot-info">

                    <span class="price">
                        €${Number(bot.price).toFixed(2)}
                    </span>

                    <span class="stock">
                        Stock: ${bot.stock}
                    </span>

                </div>

                <button
                    class="buy-button"
                    ${bot.stock <= 0 ? "disabled" : ""}
                    onclick="addToCart(${bot.id})"
                >

                    ${
                        bot.stock > 0
                        ? "🛒 Add to Cart"
                        : "Out of Stock"
                    }

                </button>

            </div>
        `;

        botGrid.appendChild(card);

    });

}


function addToCart(id) {

    const bot =
        bots.find(
            item => item.id === id
        );

    if (!bot) return;


    let cart =
        JSON.parse(
            localStorage.getItem("DBM_CART")
        ) || [];


    cart.push({

        id: bot.id,

        name: bot.name,

        price: bot.price,

        image: bot.image

    });


    localStorage.setItem(
        "DBM_CART",
        JSON.stringify(cart)
    );


    alert(
        bot.name +
        " was added to your cart!"
    );

}


renderBots();

</script>

</body>
</html>
