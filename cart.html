<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛒 Cart | Discord Board Marketplace</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #03040a;
    color: white;
}

nav {
    padding: 20px;
    background: #0d0f19;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111421;
    padding: 20px;
    margin-bottom: 12px;
    border-radius: 15px;
}

.actions {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    color: white;
    background: #5865f2;
}

.delete {
    background: #d83c4a;
}

.total {
    margin-top: 30px;
    padding: 25px;
    background: #111421;
    border-radius: 15px;
}

.checkout {
    width: 100%;
    margin-top: 15px;
    background: #5865f2;
}

</style>

</head>

<body>

<nav>

<a href="index.html">🏠 Home</a>

<a href="bots.html">🤖 Bots</a>

<a href="hosting.html">☁️ Hosting</a>

<a href="support.html">🎧 Support</a>

<a href="cart.html">🛒 Cart</a>

</nav>


<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cartContainer"></div>

<div class="total">

<h2>
Total: €<span id="total">0.00</span>
</h2>

<button
class="checkout"
onclick="checkout()"
>
💳 Proceed to Checkout
</button>

</div>

</div>


<script>

let cart =
JSON.parse(
localStorage.getItem("DBM_CART")
) || [];


function renderCart() {

const container =
document.getElementById(
"cartContainer"
);

container.innerHTML = "";


if (cart.length === 0) {

container.innerHTML =
"<p>Your cart is empty.</p>";

document.getElementById(
"total"
).textContent = "0.00";

return;

}


let total = 0;


cart.forEach((item, index) => {

total +=
item.price *
item.quantity;


const div =
document.createElement("div");

div.className = "item";


div.innerHTML = `

<div>

<h3>
${item.type === "bot" ? "🤖" : "☁️"}
${escapeHTML(item.name)}
</h3>

<p>
€${Number(item.price).toFixed(2)}
</p>

</div>


<div class="actions">

<button
onclick="changeQuantity(${index}, -1)"
>
−
</button>

<span>
${item.quantity}
</span>

<button
onclick="changeQuantity(${index}, 1)"
>
+
</button>

<button
class="delete"
onclick="removeItem(${index})"
>
🗑️
</button>

</div>

`;


container.appendChild(div);

});


document.getElementById(
"total"
).textContent =
total.toFixed(2);

}


function changeQuantity(index, amount) {

cart[index].quantity += amount;


if (cart[index].quantity <= 0) {

cart.splice(index, 1);

}


saveCart();

renderCart();

}


function removeItem(index) {

cart.splice(index, 1);

saveCart();

renderCart();

}


function saveCart() {

localStorage.setItem(
"DBM_CART",
JSON.stringify(cart)
);

}


function checkout() {

if (cart.length === 0) {

alert("Your cart is empty.");

return;

}


window.location.href =
"checkout.html";

}


function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


renderCart();

</script>

</body>

</html>
