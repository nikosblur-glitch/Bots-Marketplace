```html
<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart | Discord Bot Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f1117;
      color: white;
      min-height: 100vh;
    }

    header {
      background: #171a23;
      border-bottom: 1px solid #292d38;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 24px;
    }

    header a {
      color: white;
      text-decoration: none;
      background: #5865f2;
      padding: 10px 18px;
      border-radius: 8px;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }

    .cart-box {
      background: #171a23;
      border: 1px solid #292d38;
      border-radius: 14px;
      padding: 25px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #292d38;
      gap: 20px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-info p {
      color: #aeb4c0;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 6px;
      background: #5865f2;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .remove {
      background: #e74c3c !important;
      padding: 8px 12px;
      width: auto !important;
      font-size: 14px !important;
    }

    .summary {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .total {
      font-size: 24px;
      font-weight: bold;
    }

    .checkout {
      background: #43b581;
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .empty {
      text-align: center;
      padding: 50px;
      color: #aeb4c0;
    }

    @media (max-width: 700px) {
      .cart-item {
        flex-direction: column;
        align-items: flex-start;
      }

      .summary {
        flex-direction: column;
        gap: 20px;
        align-items: stretch;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Discord Bot Marketplace</h1>
  <a href="index.html">🏠 Home</a>
</header>

<main>

  <div class="cart-box">

    <h2>🛒 Το καλάθι σου</h2>

    <div id="cartItems"></div>

    <div class="summary">

      <div class="total">
        Σύνολο: €<span id="total">0.00</span>
      </div>

      <button class="checkout" onclick="goToCheckout()">
        💳 Checkout
      </button>

    </div>

  </div>

</main>

<script>

let cart = JSON.parse(localStorage.getItem("DBM_CART")) || [];

function saveCart() {
  localStorage.setItem("DBM_CART", JSON.stringify(cart));
}

function renderCart() {

  const container = document.getElementById("cartItems");

  container.innerHTML = "";

  if (cart.length === 0) {

    container.innerHTML = `
      <div class="empty">
        <h3>Το καλάθι σου είναι άδειο.</h3>
        <p>Πήγαινε στα Bots ή στα Hosting και πρόσθεσε ένα προϊόν.</p>
      </div>
    `;

    document.getElementById("total").textContent = "0.00";

    return;
  }

  let total = 0;

  cart.forEach((item, index) => {

    const price = Number(item.price) || 0;

    const quantity = Number(item.quantity) || 1;

    total += price * quantity;

    container.innerHTML += `

      <div class="cart-item">

        <div class="product-info">

          <h3>${escapeHTML(item.name)}</h3>

          <p>
            Τιμή: €${price.toFixed(2)}
          </p>

        </div>

        <div class="quantity">

          <button onclick="changeQuantity(${index}, -1)">
            −
          </button>

          <span>${quantity}</span>

          <button onclick="changeQuantity(${index}, 1)">
            +
          </button>

        </div>

        <strong>
          €${(price * quantity).toFixed(2)}
        </strong>

        <button
          class="remove"
          onclick="removeItem(${index})">
          Διαγραφή
        </button>

      </div>

    `;

  });

  document.getElementById("total").textContent =
    total.toFixed(2);

}

function changeQuantity(index, amount) {

  cart[index].quantity =
    (Number(cart[index].quantity) || 1) + amount;

  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }

  saveCart();

  renderCart();

}

function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

  renderCart();

}

function goToCheckout() {

  if (cart.length === 0) {

    alert("Το καλάθι είναι άδειο.");

    return;

  }

  window.location.href = "checkout.html";

}

function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

renderCart();

</script>

</body>
</html>
