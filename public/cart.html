<!DOCTYPE html>
<html lang="el">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Cart | Discord Bot Marketplace</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

.container {
    max-width: 1000px;
    margin: 50px auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.card {
    background: #181b24;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 12px;
}

.item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.quantity button {
    padding: 7px 12px;
}

.checkout {
    margin-top: 30px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
}

.payment {
    margin-top: 20px;
}

.payment button {
    width: 100%;
    margin-top: 10px;
}

.paypal {
    background: #ffc439;
    color: #111;
}

.revolut {
    background: #ffffff;
    color: #111;
}

#message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
}

</style>

</head>

<body>

<div class="container">

<h1>🛒 Your Cart</h1>

<div id="cart"></div>

<div class="card">

<h2>Total: €<span id="total">0.00</span></h2>

</div>

<div class="card checkout">

<h2>Checkout</h2>

<input
id="name"
type="text"
placeholder="Full Name"
>

<input
id="email"
type="email"
placeholder="Email"
>

<div class="payment">

<h3>Choose Payment Method</h3>

<button
class="paypal"
onclick="checkout('paypal')">

💳 Pay with PayPal

</button>

<button
class="revolut"
onclick="checkout('revolut')">

🏦 Pay with Revolut

</button>

</div>

<div id="message"></div>

</div>

</div>

<script>

let cart =
JSON.parse(localStorage.getItem("DBM_CART")) || [];

function renderCart() {

    const cartElement =
    document.getElementById("cart");

    const totalElement =
    document.getElementById("total");

    cartElement.innerHTML = "";

    let total = 0;

    if (cart.length === 0) {

        cartElement.innerHTML = `
        <div class="card">
            Your cart is empty.
        </div>
        `;

        totalElement.textContent = "0.00";

        return;
    }

    cart.forEach((item, index) => {

        const price =
        Number(item.price) || 0;

        const quantity =
        Number(item.quantity) || 1;

        total += price * quantity;

        cartElement.innerHTML += `

        <div class="card item">

            <div>

                <h3>
                    ${item.name}
                </h3>

                <p>
                    €${price.toFixed(2)}
                </p>

            </div>

            <div class="quantity">

                <button
                onclick="changeQuantity(${index}, -1)">
                -
                </button>

                <strong>
                ${quantity}
                </strong>

                <button
                onclick="changeQuantity(${index}, 1)">
                +
                </button>

            </div>

            <button
            onclick="removeItem(${index})">
            🗑️ Remove
            </button>

        </div>

        `;

    });

    totalElement.textContent =
    total.toFixed(2);

}

function changeQuantity(index, amount) {

    cart[index].quantity =
    (cart[index].quantity || 1) + amount;

    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }

    saveCart();

}

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

}

function saveCart() {

    localStorage.setItem(
        "DBM_CART",
        JSON.stringify(cart)
    );

    renderCart();

}

async function checkout(paymentMethod) {

    const name =
    document.getElementById("name").value.trim();

    const email =
    document.getElementById("email").value.trim();

    const message =
    document.getElementById("message");

    if (!name || !email) {

        message.innerHTML =
        "❌ Please enter your name and email.";

        return;

    }

    if (cart.length === 0) {

        message.innerHTML =
        "❌ Your cart is empty.";

        return;

    }

    let total = 0;

    cart.forEach(item => {

        total +=
        Number(item.price) *
        Number(item.quantity || 1);

    });

    message.innerHTML =
    "⏳ Creating your order...";

    try {

        const response =
        await fetch("/api/orders", {

            method: "POST",

            headers: {
                "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

                customerName: name,

                customerEmail: email,

                items: cart,

                total: total.toFixed(2),

                paymentMethod:
                paymentMethod

            })

        });

        const data =
        await response.json();

        if (!data.success) {

            message.innerHTML =
            "❌ Could not create order.";

            return;

        }

        localStorage.removeItem(
            "DBM_CART"
        );

        if (paymentMethod === "paypal") {

            /*
            Εδώ θα μπει το επίσημο
            PayPal Checkout integration.

            Δεν βάζουμε στοιχεία κάρτας
            στον δικό μας server.
            */

            message.innerHTML = `

            <h3>Order Created!</h3>

            <p>
            Order ID:
            <strong>${data.orderId}</strong>
            </p>

            <p>
            PayPal Checkout integration
            is ready to be connected.
            </p>

            `;

        }

        if (paymentMethod === "revolut") {

            /*
            Εδώ θα μπει το επίσημο
            Revolut Business Payment Link.
            */

            message.innerHTML = `

            <h3>Order Created!</h3>

            <p>
            Order ID:
            <strong>${data.orderId}</strong>
            </p>

            <p>
            Revolut Checkout integration
            is ready to be connected.
            </p>

            `;

        }

    } catch (error) {

        console.error(error);

        message.innerHTML =
        "❌ Connection error.";

    }

}

renderCart();

</script>

</body>

</html>
