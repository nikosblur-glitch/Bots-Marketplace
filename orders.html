<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>📦 Orders</title>

<style>

body {
    font-family: Arial;
    background: #03040a;
    color: white;
    padding: 30px;
}

.order {
    background: #111421;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 15px;
}

</style>

</head>

<body>

<h1>📦 Orders</h1>

<div id="orders"></div>


<script>

const orders =
JSON.parse(
localStorage.getItem("DBM_ORDERS")
) || [];


const container =
document.getElementById("orders");


if (orders.length === 0) {

container.innerHTML =
"<p>No orders yet.</p>";

}


orders.forEach(order => {

const div =
document.createElement("div");

div.className = "order";


div.innerHTML = `

<h2>
🆔 ${order.id}
</h2>

<p>
👤 ${escapeHTML(order.name)}
</p>

<p>
📧 ${escapeHTML(order.email)}
</p>

<p>
💬 ${escapeHTML(order.discord)}
</p>

<p>
📦 Products: ${order.cart.length}
</p>

<p>
📌 Status: ${escapeHTML(order.status)}
</p>

`;


container.appendChild(div);

});


function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}

</script>

</body>

</html>
