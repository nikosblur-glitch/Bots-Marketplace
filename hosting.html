<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>☁️ Hosting | Discord Board Marketplace</title>

<style>

body {
    margin: 0;
    font-family: Arial;
    background: #03040a;
    color: white;
}

nav {
    padding: 20px;
    background: #0d0f19;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 50px 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
}

.card {
    background: #111421;
    border: 1px solid #252a40;
    padding: 20px;
    border-radius: 18px;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 12px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #5865f2;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.price {
    font-size: 22px;
    color: #7280ff;
}

</style>

</head>

<body>

<nav>

<a href="index.html">🏠 Home</a>

<a href="bots.html">🤖 Bots</a>

<a href="hosting.html">☁️ Hosting</a>

<a href="support.html">🎧 Support</a>

<a href="cart.html">🛒 Cart</a>

</nav>


<div class="container">

<h1>☁️ Bot Hosting</h1>

<p>Reliable hosting for your Discord bots.</p>

<div
id="hostingContainer"
class="grid"
>
</div>

</div>


<script>

const hosting =
JSON.parse(
localStorage.getItem("DBM_HOSTING")
) || [];


const container =
document.getElementById(
"hostingContainer"
);


if (hosting.length === 0) {

container.innerHTML =
"<p>No Hosting products available yet.</p>";

}


hosting.forEach(item => {

const card =
document.createElement("div");

card.className = "card";


card.innerHTML = `

${
item.image
?
`<img src="${item.image}" alt="Hosting">`
:
""
}

<h2>☁️ ${escapeHTML(item.name)}</h2>

<p>
${escapeHTML(item.description || "Premium Bot Hosting")}
</p>

<p>
RAM: ${escapeHTML(item.ram || "Not specified")}
</p>

<p class="price">
€${Number(item.price).toFixed(2)}
</p>

<p>
Stock: ${item.stock}
</p>

<button
onclick="addToCart(${item.id})"
>
🛒 Add to Cart
</button>

`;


container.appendChild(card);

});


function addToCart(id) {

const item =
hosting.find(
product => product.id === id
);


if (!item) return;


let cart =
JSON.parse(
localStorage.getItem("DBM_CART")
) || [];


const existing =
cart.find(
product =>
product.productId === item.id &&
product.type === "hosting"
);


if (existing) {

existing.quantity++;

} else {

cart.push({

productId: item.id,

type: "hosting",

name: item.name,

price: item.price,

quantity: 1

});

}


localStorage.setItem(
"DBM_CART",
JSON.stringify(cart)
);


alert("☁️ Hosting added to cart!");

}


function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}

</script>

</body>

</html>
