<head>

    body {
      background: #0b0f19;

    header {
      background: #111827;

      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #5865f2;
    }

    nav {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      transition: 0.2s;
    }

    nav a:hover,
    nav a.active {
      background: #5865f2;
    }

    .hero {
      text-align: center;
      padding: 70px 20px 40px;
    }

    .hero h1 {
      font-size: 44px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #5865f2;
    }

    .hero p {
      color: #aeb7ca;
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 30px 20px 80px;
    }

    .hosting-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 22px;
    }

    .hosting-card {
      background: #111827;
      border: 1px solid #263044;
      border-radius: 16px;
      padding: 25px;
      transition: 0.25s;
      position: relative;
      overflow: hidden;
    }

    .hosting-card:hover {
      transform: translateY(-6px);
      border-color: #5865f2;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
    }

    .hosting-icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .hosting-card h2 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .hosting-card p {
      color: #aeb7ca;
      line-height: 1.5;
      min-height: 70px;
    }

    .price {
      font-size: 26px;
      font-weight: bold;
      color: #5865f2;
      margin: 20px 0;
    }

    .price small {
      font-size: 14px;
      color: #8e98ad;
      font-weight: normal;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 16px;
      border-radius: 9px;
      font-weight: bold;
      font-size: 14px;
    }

    .view-btn {
      background: #5865f2;
      color: white;
      flex: 1;
    }

    .cart-btn {
      background: #202938;
      color: white;
    }

    .view-btn:hover {
      background: #4752c4;
    }

    .cart-btn:hover {
      background: #303b4e;
    }

    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #111827;
      border: 1px solid #263044;
      border-radius: 18px;
      width: 100%;
      max-width: 550px;
      padding: 30px;
      position: relative;
    }

    .close {
      position: absolute;
      right: 20px;
      top: 15px;
      background: transparent;
      color: white;
      font-size: 25px;
    }

    .modal-box h2 {
      color: #5865f2;
      margin-bottom: 15px;
    }

    .modal-box p {
      color: #b8c0d0;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .modal-price {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .add-modal {
      width: 100%;
      background: #5865f2;
      color: white;
    }

    .cart-count {
      background: #5865f2;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 12px;
    }

    footer {
      text-align: center;
      padding: 30px;
      border-top: 1px solid #263044;
      color: #7f8ba3;
    }

    @media (max-width: 700px) {
      header {
        padding: 15px 20px;
        flex-direction: column;
        gap: 15px;
      }

      .hero h1 {
        font-size: 34px;
      }

      nav {
        justify-content: center;
      }
    }
  </style>

</head>

const hostingGrid = document.getElementById("hostingGrid");


function loadHosting() {

  hostingGrid.innerHTML = "";

  hostingProducts.forEach(product => {

    const card = document.createElement("div");

    card.className = "hosting-card";

    card.innerHTML = `

      <div class="hosting-icon">
        ${product.icon}
      </div>

      <h2>
        ${product.name}
      </h2>

      <p>
        ${product.description}
      </p>

      <div class="price">
        €${product.price.toFixed(2)}
        <small>/ month</small>
      </div>

      <div class="buttons">

        <button
          class="view-btn"
          onclick="viewHosting('${product.id}')">
          👁️ View
        </button>

        <button
          class="cart-btn"
          onclick="addToCart('${product.id}')">
          🛒
        </button>

      </div>

    `;

    hostingGrid.appendChild(card);

  });

}


function viewHosting(id) {

  const product = hostingProducts.find(
    item => item.id === id
  );

  if (!product) return;

  document.getElementById("modalTitle").textContent =
    product.icon + " " + product.name;

  document.getElementById("modalDescription").textContent =
    product.description;

  document.getElementById("modalPrice").textContent =
    "€" + product.price.toFixed(2) + " / month";

  document.getElementById("modalAdd").onclick =
    function() {

      addToCart(product.id);

      closeModal();

    };

  document.getElementById("modal").style.display =
    "flex";

}


function closeModal() {

  document.getElementById("modal").style.display =
    "none";

}


function getCart() {

  try {

    return JSON.parse(
      localStorage.getItem("DBM_CART")
    ) || [];

  } catch {

    return [];

  }

}


function saveCart(cart) {

  localStorage.setItem(
    "DBM_CART",
    JSON.stringify(cart)
  );

}


function addToCart(id) {

  const product = hostingProducts.find(
    item => item.id === id
  );

  if (!product) return;

  const cart = getCart();

  const existing = cart.find(
    item => item.id === product.id
  );

  if (existing) {

    existing.quantity += 1;

  } else {

    cart.push({

      id: product.id,

      name: product.name,

      type: "hosting",

      price: product.price,

      quantity: 1

    });

  }

  saveCart(cart);

  updateCartCount();

  alert(
    product.name + " προστέθηκε στο καλάθι!"
  );

}


function updateCartCount() {

  const cart = getCart();

  const total = cart.reduce(
    (sum, item) =>
      sum + Number(item.quantity || 0),
    0
  );

  document.getElementById(
    "cartCount"
  ).textContent = total;

}


loadHosting();

updateCartCount();


window.onclick = function(event) {

  const modal =
    document.getElementById("modal");

  if (event.target === modal) {

    closeModal();

  }

};

</script>
