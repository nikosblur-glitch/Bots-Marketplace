<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Panel | Discord Board Marketplace</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #03040a;
    color: white;
    min-height: 100vh;
    padding: 30px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    margin-bottom: 10px;
}

.subtitle {
    color: #999;
    margin-bottom: 30px;
}

.nav {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.nav a {
    text-decoration: none;
    color: white;
    background: #15182a;
    padding: 12px 18px;
    border-radius: 10px;
}

.nav a:hover {
    background: #5865f2;
}

.panel {
    background: #0d0f19;
    border: 1px solid #24283d;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
}

.panel h2 {
    margin-bottom: 20px;
}

.form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: 1px solid #292d42;
    background: #080a11;
    color: white;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.full {
    grid-column: 1 / -1;
}

button {
    border: none;
    cursor: pointer;
    padding: 13px 20px;
    border-radius: 10px;
    color: white;
    background: #5865f2;
    font-weight: bold;
}

button:hover {
    background: #4752c4;
}

.products {
    display: grid;
    gap: 12px;
}

.product {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    background: #151824;
    padding: 18px;
    border-radius: 12px;
}

.product-info h3 {
    margin-bottom: 7px;
}

.product-info p {
    color: #999;
}

.delete {
    background: #d83c4a;
}

.delete:hover {
    background: #a92d38;
}

@media(max-width:700px) {

    body {
        padding: 15px;
    }

    .form {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .product {
        flex-direction: column;
        align-items: flex-start;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>🔐 Owner Panel</h1>

<p class="subtitle">
Private administration panel for Discord Board Marketplace
</p>

<div class="nav">

<a href="index.html">🏠 Home</a>

<a href="bots.html">🤖 Bots</a>

<a href="hosting.html">☁️ Hosting</a>

<a href="support.html">🎧 Support</a>

<a href="cart.html">🛒 Cart</a>

</div>


<!-- ADD BOT -->

<div class="panel">

<h2>🤖 Add New Bot</h2>

<div class="form">

<input
id="botName"
placeholder="Bot Name"
>

<input
id="botPrice"
type="number"
step="0.01"
placeholder="Price (€)"
>

<input
id="botStock"
type="number"
min="0"
placeholder="Stock"
>

<input
id="botId"
placeholder="Discord Bot ID"
>

<input
id="botImage"
class="full"
placeholder="Bot Image URL"
>

<textarea
id="botDescription"
class="full"
placeholder="Bot Description"
></textarea>

<button
class="full"
onclick="addBot()"
>
➕ Add Bot
</button>

</div>

</div>


<!-- ADD HOSTING -->

<div class="panel">

<h2>☁️ Add New Hosting</h2>

<div class="form">

<input
id="hostingName"
placeholder="Hosting Name"
>

<input
id="hostingPrice"
type="number"
step="0.01"
placeholder="Price (€)"
>

<input
id="hostingStock"
type="number"
min="0"
placeholder="Stock"
>

<input
id="hostingRam"
placeholder="RAM (Example: 4GB)"
>

<input
id="hostingImage"
class="full"
placeholder="Hosting Image URL"
>

<textarea
id="hostingDescription"
class="full"
placeholder="Hosting Description"
></textarea>

<button
class="full"
onclick="addHosting()"
>
➕ Add Hosting
</button>

</div>

</div>


<!-- BOT INVENTORY -->

<div class="panel">

<h2>📦 Bot Inventory</h2>

<div
id="botInventory"
class="products"
>
</div>

</div>


<!-- HOSTING INVENTORY -->

<div class="panel">

<h2>☁️ Hosting Inventory</h2>

<div
id="hostingInventory"
class="products"
>
</div>

</div>

</div>


<script>

let bots =
JSON.parse(
localStorage.getItem("DBM_BOTS")
) || [];

let hosting =
JSON.parse(
localStorage.getItem("DBM_HOSTING")
) || [];


function addBot() {

const name =
document.getElementById("botName").value.trim();

const price =
Number(
document.getElementById("botPrice").value
);

const stock =
Number(
document.getElementById("botStock").value
);

const botId =
document.getElementById("botId").value.trim();

const image =
document.getElementById("botImage").value.trim();

const description =
document.getElementById("botDescription").value.trim();


if (!name || !botId || price <= 0) {

alert("Please fill in the required Bot fields.");

return;

}


const bot = {

id: Date.now(),

name: name,

price: price,

stock: stock,

botId: botId,

image: image,

description: description

};


bots.push(bot);

localStorage.setItem(
"DBM_BOTS",
JSON.stringify(bots)
);


alert("🤖 Bot added successfully!");

clearBotForm();

renderBots();

}


function addHosting() {

const name =
document.getElementById("hostingName").value.trim();

const price =
Number(
document.getElementById("hostingPrice").value
);

const stock =
Number(
document.getElementById("hostingStock").value
);

const ram =
document.getElementById("hostingRam").value.trim();

const image =
document.getElementById("hostingImage").value.trim();

const description =
document.getElementById("hostingDescription").value.trim();


if (!name || price <= 0) {

alert("Please fill in the required Hosting fields.");

return;

}


const item = {

id: Date.now(),

name: name,

price: price,

stock: stock,

ram: ram,

image: image,

description: description

};


hosting.push(item);

localStorage.setItem(
"DBM_HOSTING",
JSON.stringify(hosting)
);


alert("☁️ Hosting added successfully!");

clearHostingForm();

renderHosting();

}


function renderBots() {

const container =
document.getElementById("botInventory");

container.innerHTML = "";


if (bots.length === 0) {

container.innerHTML =
"<p style='color:#888'>No bots added yet.</p>";

return;

}


bots.forEach(bot => {

const div =
document.createElement("div");

div.className = "product";

div.innerHTML = `

<div class="product-info">

<h3>🤖 ${escapeHTML(bot.name)}</h3>

<p>
Price: €${Number(bot.price).toFixed(2)}
<br>
Stock: ${bot.stock}
</p>

</div>

<button
class="delete"
onclick="deleteBot(${bot.id})"
>
🗑️ Delete
</button>

`;

container.appendChild(div);

});

}


function renderHosting() {

const container =
document.getElementById("hostingInventory");

container.innerHTML = "";


if (hosting.length === 0) {

container.innerHTML =
"<p style='color:#888'>No hosting products added yet.</p>";

return;

}


hosting.forEach(item => {

const div =
document.createElement("div");

div.className = "product";

div.innerHTML = `

<div class="product-info">

<h3>☁️ ${escapeHTML(item.name)}</h3>

<p>
Price: €${Number(item.price).toFixed(2)}
<br>
Stock: ${item.stock}
<br>
RAM: ${escapeHTML(item.ram || "Not specified")}
</p>

</div>

<button
class="delete"
onclick="deleteHosting(${item.id})"
>
🗑️ Delete
</button>

`;

container.appendChild(div);

});

}


function deleteBot(id) {

if (!confirm("Delete this Bot?")) return;

bots =
bots.filter(
bot => bot.id !== id
);

localStorage.setItem(
"DBM_BOTS",
JSON.stringify(bots)
);

renderBots();

}


function deleteHosting(id) {

if (!confirm("Delete this Hosting?")) return;

hosting =
hosting.filter(
item => item.id !== id
);

localStorage.setItem(
"DBM_HOSTING",
JSON.stringify(hosting)
);

renderHosting();

}


function clearBotForm() {

document.getElementById("botName").value = "";

document.getElementById("botPrice").value = "";

document.getElementById("botStock").value = "";

document.getElementById("botId").value = "";

document.getElementById("botImage").value = "";

document.getElementById("botDescription").value = "";

}


function clearHostingForm() {

document.getElementById("hostingName").value = "";

document.getElementById("hostingPrice").value = "";

document.getElementById("hostingStock").value = "";

document.getElementById("hostingRam").value = "";

document.getElementById("hostingImage").value = "";

document.getElementById("hostingDescription").value = "";

}


function escapeHTML(text) {

return String(text)

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


renderBots();

renderHosting();

</script>

</body>
</html>
