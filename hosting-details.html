const params = new URLSearchParams(window.location.search);

const id = params.get("id");

const product = hostingProducts[id];

const details = document.getElementById("productDetails");

if (!product) {

    details.innerHTML = `
        <h1>❌ Hosting Not Found</h1>
        <p>Το προϊόν που ζητήσατε δεν υπάρχει.</p>
        <button onclick="location.href='hosting.html'">
            Back to Hosting
        </button>
    `;

} else {

    const views =
        localStorage.getItem("views_" + id) || 0;

    details.innerHTML = `

        <h1>🖥️ ${product.name}</h1>

        <p class="description">
            ${product.description}
        </p>

        <div class="price">
            €${product.price.toFixed(2)} / month
        </div>

        <div class="views">
            👁️ ${views} Views
        </div>

        <h2>Features</h2>

        <ul>
            ${product.features
                .map(feature => `<li>✅ ${feature}</li>`)
                .join("")}
        </ul>

        <button onclick="addToCart()">
            🛒 Add to Cart
        </button>

        <button onclick="location.href='hosting.html'">
            ← Back to Hosting
        </button>

    `;

}

function addToCart() {

    let cart =
        JSON.parse(localStorage.getItem("DBM_CART") || "[]");

    const existing =
        cart.find(item => item.id === id);

    if (existing) {

        existing.quantity++;

    } else {

        cart.push({

            id: id,

            name: product.name,

            price: product.price,

            type: "hosting",

            quantity: 1

        });

    }

    localStorage.setItem(
        "DBM_CART",
        JSON.stringify(cart)
    );

    alert("Το Hosting προστέθηκε στο καλάθι!");

}
